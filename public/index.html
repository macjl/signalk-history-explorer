<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071c2b" />
    <title>Signal K — History Explorer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="brand"><span class="brand-mark">⌁</span><span>Signal K</span><strong>HISTORY EXPLORER</strong></div>
        <div id="api-state" class="api-state"><i></i>Connexion à l’historique…</div>
      </header>

      <section class="period-bar" aria-label="Période à explorer">
        <div class="period-copy"><span>Explorer la période</span><small>Les paths affichés ont des données dans cet intervalle.</small></div>
        <label>Début<input id="from-date" type="datetime-local" /></label>
        <span class="date-arrow">→</span>
        <label>Fin<input id="to-date" type="datetime-local" /></label>
        <button id="apply-period" class="primary-button">Rechercher</button>
      </section>

      <section class="explorer" aria-labelledby="explorer-title">
        <div class="explorer-heading">
          <div><p class="eyebrow">HISTORIQUE DISPONIBLE</p><h1 id="explorer-title">Paths</h1><p id="range-caption">Choisissez une période pour découvrir les données.</p></div>
          <div class="heading-actions"><button id="collapse-all" class="quiet-button">Tout replier</button></div>
        </div>

        <div class="path-toolbar">
          <div class="search-box"><span>⌕</span><input id="path-filter" type="search" placeholder="Filtrer les paths, par ex. wind, propulsion, battery…" autocomplete="off" /></div>
          <span id="paths-count" class="result-count">—</span>
        </div>

        <div id="notice" class="notice" hidden></div>
        <div id="path-groups" class="path-groups" aria-live="polite"></div>
      </section>
    </main>
    <div id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
